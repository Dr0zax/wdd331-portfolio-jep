<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Andrew Jeppesen WDD 331 Portfolio</title>
        <script type="module" src="js/theme-preferences.js"></script>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <header>
            <details class="theme-menu">
                        <summary class="theme-control">
                            <span class="visually-hidden">Color scheme</span>
                        </summary>
                        <div
                            class="theme-extra"
                            role="group"
                            aria-label="Choose color scheme"
                        >
                            <label
                                class="theme-control theme-pick"
                                data-theme-pick="light"
                            >
                                <input
                                    name="theme-preference"
                                    type="radio"
                                    value="light"
                                />
                                <span aria-hidden="true">&#9788;&#65039;</span>
                                <span class="visually-hidden">Light</span>
                            </label>
                            <label
                                class="theme-control theme-pick"
                                data-theme-pick="system"
                            >
                                <input
                                    name="theme-preference"
                                    type="radio"
                                    value="system"
                                    checked
                                />
                                <span aria-hidden="true">&#9881;&#65039;</span>
                                <span class="visually-hidden">System default</span>
                            </label>
                            <label
                                class="theme-control theme-pick"
                                data-theme-pick="dark"
                            >
                                <input
                                    name="theme-preference"
                                    type="radio"
                                    value="dark"
                                />
                                <span aria-hidden="true">&#127766;</span>
                                <span class="visually-hidden">Dark</span>
                            </label>
                        </div>
            </details>
        </header>
        <main>
            <div class="introduction">
                <h1 class="align-center">Andrew Jeppesen</h1>
                <p class="align-center">
                    Hi, I'm a software engineering major currently studying up
                    at BYUI. This is my personal portfolio for the class WDD 331
                    Advanced CSS
                </p>
            </div>

            <div class="assignments-container">
                <h2>Assignments</h2>
                <ul>
                    <li>
                        <a href="unit-1/custom-properties/index.html">
                            Custom Properties and Nesting
                        </a>
                    </li>
                    <li>
                        <a href="unit-2/layered-components/index.html">
                            Layered Components
                        </a>
                    </li>
                </ul>
            </div>
        </main>
    </body>
</html>
